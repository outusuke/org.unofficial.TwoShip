name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TwoShip.flatpak
          manifest-path: org.unofficial.TwoShip.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: TwoShip.flatpak

  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: TwoShip.flatpak
          generate_release_notes: true
          body: |
            Unofficial Flatpak of 2 Ship 2 Harkinian 5.0.1 (Battler Bravo).
            You need your own Zelda: Majora's Mask ROM (see https://2ship.equipment/ for supported dumps).

            Install:
              flatpak install --user TwoShip.flatpak
              flatpak run org.unofficial.TwoShip

            Put your ROM in:
              ~/.var/app/org.unofficial.TwoShip/data/
